name: Mobile CI (iOS & Android)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "scripts/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "scripts/mobile/**"
      - ".github/workflows/mobile-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-web-build:
    name: Build & Verify Mobile Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Mobile Web Bridge
        run: pnpm --filter @md-editor/mobile-core test

      - name: Build and Sync Mobile Assets
        run: pnpm run build:mobile

      - name: Archive Web Assets
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: apps/mobile/core/dist
          retention-days: 7

  ios-ci:
    name: iOS Native Shell (Swift 6 & Xcode)
    needs: mobile-web-build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install & Sync Web Bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:mobile

      - name: Run Swift Bridge Contract Tests
        working-directory: apps/mobile/ios
        run: swift run InkpointContractTests

      - name: Build iOS App Target (Simulator)
        run: |
          xcodebuild -project apps/mobile/ios/Inkpoint.xcodeproj \
            -scheme Inkpoint \
            -destination 'generic/platform=iOS Simulator' \
            clean build \
            CODE_SIGNING_ALLOWED=NO

  android-ci:
    name: Android Native Shell (Compose & SAF)
    needs: mobile-web-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install & Sync Web Bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:mobile

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit Tests
        working-directory: apps/mobile/android
        run: ./gradlew testDebugUnitTest

      - name: Assemble Android Debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: inkpoint-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
