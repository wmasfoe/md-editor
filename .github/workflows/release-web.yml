name: Release Web App

on:
  push:
    tags:
      - "web-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release Web App
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read Web version
        id: web_version
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const webPackage = JSON.parse(fs.readFileSync("apps/web/package.json", "utf8"));
          const version = webPackage.version;
          const expectedTag = `web-v${version}`;
          console.log(`version=${version}`);
          console.log(`tag=${expectedTag}`);
          NODE

      - name: Typecheck
        run: pnpm --filter @md-editor/web typecheck

      - name: Test
        run: pnpm --filter @md-editor/web test

      - name: Build Web app
        run: pnpm build:web

      - name: Deploy Web app to Vercel production
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID || 'prj_OYIhjN5VFmxwa5t8v9ydZywt0f3O' }}
          VERCEL_WEB_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID || 'prj_OYIhjN5VFmxwa5t8v9ydZywt0f3O' }}
        run: pnpm deploy:web
