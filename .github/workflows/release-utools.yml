name: Build and Release uTools Plugin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/utools/**"
      - "packages/editor-core/**"
      - "packages/editor-ui/**"
      - "packages/file-system/**"
      - "packages/markdown-fidelity/**"
      - "packages/renderer-codemirror/**"
      - "packages/shared/**"
      - "packages/syntax-plugins/**"
      - "scripts/release/validate-utools-release*"
      - ".github/workflows/release-utools.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    tags:
      - "utools-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Validate and package uTools plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @md-editor/utools typecheck

      - name: Test
        run: pnpm --filter @md-editor/utools test && pnpm test:release

      - name: Build uTools plugin
        run: pnpm build:utools

      - name: Validate release metadata and bundle
        id: release
        shell: bash
        run: |
          args=(--dist apps/utools/dist --github-output "$GITHUB_OUTPUT")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          node scripts/release/validate-utools-release.mjs "${args[@]}"

      - name: Package release directory
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          cd apps/utools/dist
          zip -r "../../../inkpoint-utools-${RELEASE_VERSION}.zip" .

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: inkpoint-utools-${{ steps.release.outputs.version }}
          path: inkpoint-utools-${{ steps.release.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish uTools GitHub Release
    if: startsWith(github.ref, 'refs/tags/utools-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: inkpoint-utools-${{ needs.build.outputs.version }}
          path: release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          bundle="release/inkpoint-utools-${RELEASE_VERSION}.zip"
          notes="Inkpoint uTools ${RELEASE_VERSION} release bundle. Unzip this bundle and select its plugin.json in the uTools developer tool. Marketplace submission and review remain in the official uTools developer tool."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$bundle" --clobber
          else
            gh release create "$RELEASE_TAG" "$bundle" \
              --title "Inkpoint uTools ${RELEASE_VERSION}" \
              --notes "$notes"
          fi
