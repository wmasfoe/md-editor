name: Sync Historical Releases to R2

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (simulate without downloading or uploading)"
        type: boolean
        default: false
      limit:
        description: "Limit number of releases to sync (empty for all 68 releases)"
        type: string
        default: ""
      start_from:
        description: "Start from specific version/tag (e.g., v0.9.0)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  sync:
    name: Sync Releases to R2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run History Sync to Cloudflare R2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'inkpoint-releases' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ inputs.limit }}"
          fi
          if [ -n "${{ inputs.start_from }}" ]; then
            ARGS="$ARGS --start-from=${{ inputs.start_from }}"
          fi

          echo "🚀 Starting historical releases sync with args: $ARGS"
          node scripts/release/sync-all-historical-to-r2.mjs $ARGS
