name: GPUI Beta

on:
  pull_request:
    branches:
      - beta
  push:
    branches:
      - beta

concurrency:
  group: gpui-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-gpui:
    name: Build GPUI macOS arm64
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Set up WebAssembly toolchain
        uses: dtolnay/rust-toolchain@nightly-2026-11-18
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-bin: true

      - name: Derive beta version
        id: version
        shell: bash
        run: |
          source_version="$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' apps/desktop/Cargo.toml | head -n 1)"
          if [[ -z "$source_version" ]]; then
            echo "Could not read GPUI Cargo package version." >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$source_version"
          base_version="${major}.${minor}.$((patch + 1))"
          short_sha="${GITHUB_SHA:0:7}"
          beta_version="${base_version}-beta.sha${short_sha}"
          echo "version=${beta_version}" >> "$GITHUB_OUTPUT"
          echo "tag=gpui-beta.sha${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check

      - name: Run Clippy
        run: cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo +1.98.0 test --locked --workspace

      - name: Install JavaScript workspace
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WebAssembly bindings CLI
        run: cargo +1.98.0 install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Build private WebAssembly editor package
        run: pnpm --filter @md-editor/editor-web build

      - name: Smoke test packed private WebAssembly package
        run: pnpm --filter @md-editor/editor-web test:packed

      - name: Build Playground
        env:
          VITE_BASE_PATH: /
        run: pnpm --filter @md-editor/web build

      - name: Install Playwright browser
        run: pnpm --filter @md-editor/web exec playwright install chromium

      # 注意：不要写成 `test:browser -- --grep GPUI`。pnpm 会把独立的 `--` 一并传给
      # Playwright，其后的 `--grep` 就不再作为选项解析，结果是整个文件都跑一遍。
      - name: Smoke test packaged GPUI Playground
        env:
          VITE_BASE_PATH: /
        run: pnpm --filter @md-editor/web test:browser --grep GPUI

      - name: Package browser Playground
        env:
          GPUI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > apps/web/dist/README.txt <<'EOF'
          Inkpoint GPUI Preview Playground

          Extract this archive and run `python3 -m http.server 4173` from the extracted directory.
          Open http://127.0.0.1:4173/ in a browser.
          EOF
          mkdir -p target/gpui-preview
          ditto -c -k --sequesterRsrc --keepParent apps/web/dist "target/gpui-preview/Inkpoint-GPUI-Playground_${GPUI_VERSION}.zip"

      - name: Prepare local AI runtime
        run: node scripts/release/prepare-llama-runtime.mjs --target aarch64-apple-darwin

      - name: Build GPUI release binary
        run: cargo +1.98.0 build --locked --release --target aarch64-apple-darwin --package inkpoint-gpui

      - name: Package DMG
        env:
          GPUI_VERSION: ${{ steps.version.outputs.version }}
          CARGO_BUILD_TARGET: aarch64-apple-darwin
        run: node apps/desktop/scripts/package-macos.mjs

      - name: Verify DMG
        shell: bash
        run: |
          dmg_path="target/gpui-preview/Inkpoint-GPUI-Preview_${{ steps.version.outputs.version }}_aarch64.dmg"
          test -f "$dmg_path"
          hdiutil verify "$dmg_path"

      - name: Upload GPUI beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inkpoint-gpui-preview-${{ steps.version.outputs.version }}
          path: |
            target/gpui-preview/*.dmg
            target/gpui-preview/*.zip
          if-no-files-found: error
          retention-days: 30

  publish-gpui-beta:
    name: Publish GPUI beta prerelease
    if: github.event_name == 'push'
    needs: build-gpui
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Download GPUI beta artifacts
        uses: actions/download-artifact@v4
        with:
          name: inkpoint-gpui-preview-${{ needs.build-gpui.outputs.version }}
          path: release-assets

      - name: Create GPUI prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-gpui.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-gpui.outputs.version }}
          SHORT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          notes="$(printf 'Inkpoint GPUI Preview %s\n\nNative GPUI desktop beta from beta commit %s. Includes one macOS Apple Silicon DMG and a browser Playground ZIP. Extract the Playground ZIP and serve its contents with `python3 -m http.server 4173`. The private editor npm package is packed for the build and is not published. The preview app does not update the stable Inkpoint installation.' "$RELEASE_VERSION" "$SHORT_SHA")"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_target="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
            if [[ "$existing_target" != "$GITHUB_SHA" ]]; then
              echo "Existing prerelease tag $RELEASE_TAG points to $existing_target, expected $GITHUB_SHA." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Inkpoint GPUI Preview ${RELEASE_VERSION}" \
              --notes "$notes" \
              --prerelease
            gh release upload "$RELEASE_TAG" release-assets/*.dmg release-assets/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.dmg release-assets/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Inkpoint GPUI Preview ${RELEASE_VERSION}" \
              --notes "$notes" \
              --prerelease
          fi
