name: GPUI Beta

on:
  pull_request:
    branches:
      - beta
  push:
    branches:
      - beta

concurrency:
  group: gpui-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-gpui:
    name: Build GPUI macOS arm64
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-bin: true

      - name: Derive beta version
        id: version
        shell: bash
        run: |
          source_version="$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' apps/desktop/Cargo.toml | head -n 1)"
          if [[ -z "$source_version" ]]; then
            echo "Could not read GPUI Cargo package version." >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$source_version"
          base_version="${major}.${minor}.$((patch + 1))"
          short_sha="${GITHUB_SHA:0:7}"
          beta_version="${base_version}-beta.sha${short_sha}"
          echo "version=${beta_version}" >> "$GITHUB_OUTPUT"
          echo "tag=gpui-beta.sha${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo +1.99.0 fmt --all -- --check

      - name: Run Clippy
        run: cargo +1.99.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo +1.99.0 test --locked --workspace

      - name: Verify vendored llama runtime
        run: |
          test -x apps/desktop/runtime/llama/llama-server-aarch64-apple-darwin
          test -d apps/desktop/runtime/llama/llama-runtime-macos-arm64

      - name: Build GPUI release binary
        run: cargo +1.99.0 build --locked --release --target aarch64-apple-darwin --package inkpoint-gpui

      - name: Package DMG
        env:
          GPUI_VERSION: ${{ steps.version.outputs.version }}
          CARGO_BUILD_TARGET: aarch64-apple-darwin
        run: bash apps/desktop/scripts/package-macos.sh

      - name: Verify DMG
        shell: bash
        run: |
          dmg_path="target/gpui-preview/Inkpoint-GPUI-Preview_${{ steps.version.outputs.version }}_aarch64.dmg"
          test -f "$dmg_path"
          hdiutil verify "$dmg_path"

      - name: Upload GPUI beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inkpoint-gpui-preview-${{ steps.version.outputs.version }}
          path: |
            target/gpui-preview/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish-gpui-beta:
    name: Publish GPUI beta prerelease
    if: github.event_name == 'push'
    needs: build-gpui
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Download GPUI beta artifacts
        uses: actions/download-artifact@v4
        with:
          name: inkpoint-gpui-preview-${{ needs.build-gpui.outputs.version }}
          path: release-assets

      - name: Create GPUI prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-gpui.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-gpui.outputs.version }}
          SHORT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          notes="$(printf 'Inkpoint GPUI Preview %s\n\nNative GPUI desktop beta from beta commit %s. Includes one macOS Apple Silicon DMG. The preview app does not update the stable Inkpoint installation.' "$RELEASE_VERSION" "$SHORT_SHA")"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_target="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
            if [[ "$existing_target" != "$GITHUB_SHA" ]]; then
              echo "Existing prerelease tag $RELEASE_TAG points to $existing_target, expected $GITHUB_SHA." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Inkpoint GPUI Preview ${RELEASE_VERSION}" \
              --notes "$notes" \
              --prerelease
            gh release upload "$RELEASE_TAG" release-assets/*.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Inkpoint GPUI Preview ${RELEASE_VERSION}" \
              --notes "$notes" \
              --prerelease
          fi
