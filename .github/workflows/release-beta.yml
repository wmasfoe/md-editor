name: Release Beta (Multi-Platform)

# beta 分支 push 即触发 beta 预发布构建：
# - 版本派生为 <下一个 patch 版本>-beta.sha<commit短哈希>，release tag 天然唯一；
# - 产物只上传到本仓库 GitHub Release（标记 Pre-release），
#   不更新 Homebrew cask / curl installer / updater manifest / 网站 changelog，
#   因此不影响 stable 渠道的 sh、brew 安装；
# - 正式发版仍走 release-desktop.yml（手动打 v* tag）。
on:
  push:
    branches:
      - beta

concurrency:
  group: release-beta
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build Beta macOS (Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Derive beta version
        id: beta_version
        run: node scripts/release/derive-beta-version.mjs >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-beta-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-beta-
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:rust

      - name: Build macOS app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm build:macos:release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beta-artifacts-macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  build-linux-x64:
    name: Build Beta Linux (x86_64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Derive beta version
        run: node scripts/release/derive-beta-version.mjs

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare llama runtime sidecar
        run: node scripts/release/prepare-llama-runtime.mjs --target x86_64-unknown-linux-gnu

      - name: Build Linux app
        run: pnpm build:linux

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beta-artifacts-linux-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb

  build-windows-x64:
    name: Build Beta Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Derive beta version
        run: node scripts/release/derive-beta-version.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare llama runtime sidecar
        run: node scripts/release/prepare-llama-runtime.mjs --target x86_64-pc-windows-msvc

      - name: Build Windows app
        run: pnpm build:windows

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beta-artifacts-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/zip/*.zip

  publish-beta-release:
    name: Publish multi-platform beta release
    needs: [build-macos, build-linux-x64, build-windows-x64]
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Derive beta version
        id: beta_version
        run: node scripts/release/derive-beta-version.mjs >> "$GITHUB_OUTPUT"

      - name: Download all beta artifacts
        uses: actions/download-artifact@v4
        with:
          path: beta-release-artifacts

      - name: Create or update beta GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.beta_version.outputs.beta_tag }}
          RELEASE_VERSION: ${{ steps.beta_version.outputs.beta_version }}
          SHORT_SHA: ${{ steps.beta_version.outputs.short_sha }}
          SOURCE_VERSION: ${{ steps.beta_version.outputs.source_version }}
          BASE_VERSION: ${{ steps.beta_version.outputs.base_version }}
        run: |
          notes="## ⚠️ Beta 预发布构建 (Multi-Platform)

          - 来源分支：\`beta\`（commit \`${SHORT_SHA}\`），基于稳定版本 \`${SOURCE_VERSION}\` 的下一个 beta 版本 \`${BASE_VERSION}\`
          - 这是**测试版本**，包含 macOS、Linux、Windows 构建产物，仅通过本 Release 页面下载，**不会**更新 stable sh / Homebrew / tap 安装渠道
          - 反馈问题请附上此版本号 ${RELEASE_VERSION}"

          files=( $(find beta-release-artifacts -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.zip' -o -name '*.app.tar.gz*' \)) )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "[Beta] Markdown Editor $RELEASE_VERSION" \
              --notes "$notes" \
              --prerelease

            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --title "[Beta] Markdown Editor $RELEASE_VERSION" \
              --notes "$notes" \
              --prerelease
          fi
