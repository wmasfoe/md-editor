name: Build Desktop App

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".vscode/**"
      - ".agents/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Oxlint)
        run: pnpm lint:oxlint

      - name: Format (Prettier)
        run: pnpm format:prettier:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Validate release version files
        run: node scripts/release/validate-release-version.mjs

  test-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @md-editor/desktop exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @md-editor/desktop test:browser

  test-rust:
    name: Rust Validation (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev file unzip
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Rust fmt check
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  ci-status:
    name: All Checks Passed
    if: always()
    needs:
      - lint
      - typecheck
      - test-unit
      - test-e2e
      - test-rust
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate status
        run: |
          results="${{ needs.lint.result }} ${{ needs.typecheck.result }} ${{ needs.test-unit.result }} ${{ needs.test-e2e.result }} ${{ needs.test-rust.result }}"
          echo "Job results: $results"
          for res in $results; do
            if [[ "$res" != "success" ]]; then
              echo "❌ One or more CI jobs failed (status: $res)."
              exit 1
            fi
          done
          echo "✅ All CI jobs succeeded!"

  build-desktop:
    name: Build Desktop (${{ matrix.platform.name }})
    if: github.event_name == 'workflow_dispatch'
    needs:
      - ci-status
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            build_cmd: pnpm build:macos
            artifact_name: markdown-editor-macos-dmg
            artifact_path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            build_cmd: pnpm build:linux
            artifact_name: markdown-editor-linux
            artifact_path: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          - name: Windows
            os: windows-latest
            build_cmd: pnpm build:windows
            artifact_name: markdown-editor-windows
            artifact_path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev file unzip
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare llama runtime sidecar
        run: node scripts/release/prepare-llama-runtime.mjs

      - name: Build app
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LD_LIBRARY_PATH: "${{ github.workspace }}/apps/desktop/src-tauri/binaries"
        run: ${{ matrix.platform.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_path }}
          if-no-files-found: error
