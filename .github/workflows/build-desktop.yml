name: Build Desktop App

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".vscode/**"
      - ".agents/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Oxlint)
        run: pnpm lint:oxlint

      - name: Format (Prettier)
        run: pnpm format:prettier:check

      # 仓库结构守卫（目录职责/命名/测试位置/体量阈值与豁免）。
      # 注意不能直接换成 `pnpm lint`：那会连带执行 cargo fmt/clippy，而本 job 未安装 Rust。
      - name: Lint (Structure)
        run: pnpm lint:structure

      # Changeset 校验：既检查“改了已发布包却没有 changeset”，
      # 也检查 changeset 本身格式合法（例如混入 ignored 包）。
      # 后者曾导致 PR #270 合并后 main 的 release-npm-packages workflow 失败，
      # 因为 `changeset version` 只在发版时才解析 changeset。
      - name: Check Changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: node scripts/packages/check-changeset.mjs --strict

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test` 包含 test:render-diff（TS/Rust 双实现一致性守门），
      # 它需要 cargo 才能跑 Rust 侧。因此本 job 必须装 Rust 工具链，
      # 否则差分测试会因「crate 存在但找不到 cargo」而失败。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: pnpm test

      - name: Verify npm tarball consumers
        run: pnpm verify:packages

      - name: Verify core/editor npm closure
        run: pnpm verify:editor-packages

      # 生产构建 smoke：apps/web 的产物此前只在 web-v* tag 发布时才构建，
      # PR 阶段发现不了构建期问题（例如幽灵依赖导致的 CSS 解析失败）。
      # 桌面端产物已由 `pnpm test` 中的 test:bundle 探针覆盖（它会做一次完整 desktop Vite 构建）。
      - name: Build Web app (production)
        run: pnpm build:web

      - name: Assert web output has no sourcemaps
        run: node scripts/release/assert-no-sourcemaps.mjs apps/web/dist

      - name: Validate release version files
        run: node scripts/release/validate-release-version.mjs

  # 发布脚本断言（llama dylib 闭包、sidecar 启动等）依赖 `otool`，在 ubuntu 的
  # Unit Tests job 里会被 `skip: process.platform !== "darwin"` 跳过。单独用 macOS
  # runner 跑，否则 `tauri.macos.conf.json` 的裁剪改动在 CI 中完全没有验证。
  test-release-scripts:
    name: Release Script Tests (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release script tests (macOS-only bundle assertions)
        run: pnpm test:release

  # 桌面端浏览器 E2E 是 PR CI 的最长链路（曾占 12m 里的 9m30s），因此按 Playwright
  # 的 `--shard` 切片并行跑：每个 shard 是独立 runner，互不干扰，setup 开销固定。
  #
  # 为什么停在 3 片而不更多：macOS runner 的并发上限是 5（Free/Pro）。同一 run 里
  # 还有 Release Script Tests 和 Rust Validation (macOS) 各占 1 个槽位（2 + 3 = 5）。
  # 实测 4 片时 `Browser E2E (4/4)` 和 `Rust Validation (macOS)` 确实在排队，
  # 要开第 4 片必须先把 Web Diagram E2E 这类不依赖 macOS 的 job 迁到 ubuntu。
  # 增减分片只需改下面的 `matrix.shard` 列表，`strategy.job-total` 会自动跟上。
  test-e2e-desktop:
    name: Browser E2E (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @md-editor/desktop exec playwright install chromium

      # 直接调用 playwright 而不是 `test:browser` 脚本，避免 pnpm 参数透传歧义。
      - name: Run E2E tests
        run: >-
          pnpm --filter @md-editor/desktop exec playwright test
          --config playwright.config.ts
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # 失败时要能拿到 HTML report 与 trace，否则分片后定位失败点只能靠日志。
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

  # 桌面端 E2E 留在 macOS 是有意义的：应用里有 `isMac` 分支（如
  # `packages/app-ui/src/keyboard.ts`），E2E 里的 `MOD_KEY` 会在 darwin 上跑 Meta 路径。
  # 而这个 web 图表套件只测 `apps/web` 的 Playwright Chromium，自己就按
  # `navigator.platform` 选修饰键，也没有像素级基准图（截图只做产物），
  # 且它已经不在 macOS 瓶颈上——放到 ubuntu 既快又能腾出 macOS 并发槽位。
  test-e2e-web-diagram:
    name: Web Diagram E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for web diagram tests
        run: pnpm --filter @md-editor/web exec playwright install --with-deps chromium

      - name: Run web Mermaid diagram tests
        run: pnpm --filter @md-editor/web exec playwright test --config playwright.diagram.config.ts

      - name: Upload web Mermaid test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-mermaid-diagram-test-results
          path: apps/web/test-results/diagram-e2e
          if-no-files-found: ignore
          retention-days: 7

  test-rust:
    name: Rust Validation (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev file unzip squashfs-tools desktop-file-utils xvfb icewm x11-utils xdotool libegl1 libgl1 libgles2 libglx-mesa0 libgl1-mesa-dri libosmesa6 mesa-utils gcc appstream zsync
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Rust fmt check
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: |
          cargo test --manifest-path crates/render/Cargo.toml
          cargo test --manifest-path crates/render-ffi/Cargo.toml
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      # 双实现一致性的守门设施：同一份语料同时跑 TS 与 Rust 渲染器。
      # 虽然 `test-unit` 里的 `pnpm test` 已包含它，这里再显式跑一次，
      # 让 parity 失败在 CI 上单独可见、不必翻整条测试日志。
      - name: Render parity (TS vs Rust)
        run: pnpm test:render-diff

  # The manual matrix below stays workflow_dispatch-only. Pull requests still have
  # to build the real x86_64 AppImage: validate-appimage.mjs runs inside
  # `pnpm build:linux`, and unit tests cannot see a missing .upd_info section
  # or a runtime that ignores --appimage-updateinformation.
  #
  # 不要为了 PR 时长把它删掉或按 `paths:` 收窄（2026-11-21 明确决定）：稳定性优先于速度。
  # 它是唯一能在 PR 阶段拦住 AppImage 打包契约的检查（.upd_info / .zsync /
  # AppRun 权限 / 相对符号链接 / appstreamcli / 不打包 libwayland-client /
  # headless 启动），而这些历史上连续出过 5 个 fix（#190–#196），其中 v0.16.4
  # 就是发版时才炸的。`test:bundle` 只验前端产物与 gzip 预算，E2E 跑的是 dev server，
  # 都不是打包产物。它也是 PR 当前的临界路径（~5–7m），这是有意付费的。
  build-linux-appimage:
    name: Build Linux AppImage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev file unzip squashfs-tools desktop-file-utils xvfb icewm x11-utils xdotool libegl1 libgl1 libgles2 libglx-mesa0 libgl1-mesa-dri libosmesa6 mesa-utils gcc appstream zsync
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare llama runtime sidecar
        run: node scripts/release/prepare-llama-runtime.mjs

      - name: Build Linux app
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LD_LIBRARY_PATH: "${{ github.workspace }}/apps/desktop/src-tauri/binaries"
        run: pnpm build:linux

      - name: Assert no shipped sourcemaps
        run: node scripts/release/assert-no-sourcemaps.mjs apps/desktop/dist apps/desktop/src-tauri/target/release/bundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markdown-editor-linux-pr
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.zsync
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  ci-status:
    name: All Checks Passed
    if: always()
    # 新增上游 job 只需加到这个列表：状态判断在下面的脚本里遍历 `needs` 完成，
    # 不需要再手写一遍表达式（旧实现漏加 job 就会静默放行）。
    needs:
      - lint
      - typecheck
      - test-unit
      - test-release-scripts
      - test-e2e-desktop
      - test-e2e-web-diagram
      - test-rust
      - build-linux-appimage
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.NEEDS_JSON);

          // build-linux-appimage 只在 pull_request 上运行；手动 dispatch 时它必然 skipped。
          // 其余任何 skipped / cancelled / failure 都属于真实问题。
          const maySkipOutsidePullRequest = new Set(["build-linux-appimage"]);

          let failed = false;
          for (const [job, { result }] of Object.entries(results)) {
            const toleratedSkip =
              result === "skipped" &&
              process.env.EVENT_NAME !== "pull_request" &&
              maySkipOutsidePullRequest.has(job);
            const ok = result === "success" || toleratedSkip;
            console.log(`${ok ? "✅" : "❌"} ${job}: ${result}`);
            if (!ok) {
              failed = true;
            }
          }

          if (failed) {
            console.error("❌ One or more CI jobs did not succeed.");
            process.exit(1);
          }
          console.log("✅ All CI jobs succeeded!");
          NODE

  build-desktop:
    name: Build Desktop (${{ matrix.platform.name }})
    if: github.event_name == 'workflow_dispatch'
    needs:
      - ci-status
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            build_cmd: pnpm build:macos
            artifact_name: markdown-editor-macos-dmg
            artifact_path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            build_cmd: pnpm build:linux
            artifact_name: markdown-editor-linux
            artifact_path: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.zsync
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          - name: Windows
            os: windows-latest
            build_cmd: pnpm build:windows
            artifact_name: markdown-editor-windows
            artifact_path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev file unzip squashfs-tools desktop-file-utils xvfb icewm x11-utils xdotool libegl1 libgl1 libgles2 libglx-mesa0 libgl1-mesa-dri libosmesa6 mesa-utils gcc appstream zsync
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare llama runtime sidecar
        run: node scripts/release/prepare-llama-runtime.mjs

      - name: Build app
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LD_LIBRARY_PATH: "${{ github.workspace }}/apps/desktop/src-tauri/binaries"
        run: ${{ matrix.platform.build_cmd }}

      - name: Assert no shipped sourcemaps
        run: node scripts/release/assert-no-sourcemaps.mjs apps/desktop/dist apps/desktop/src-tauri/target/release/bundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_path }}
          if-no-files-found: error
