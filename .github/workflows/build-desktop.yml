name: Build Desktop App

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-matrix:
    name: Validate (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            build_cmd: pnpm build:macos
            artifact_name: markdown-editor-macos-dmg
            artifact_path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            build_cmd: pnpm build:linux
            artifact_name: markdown-editor-linux
            artifact_path: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          - name: Windows
            os: windows-latest
            build_cmd: pnpm build:windows
            artifact_name: markdown-editor-windows
            artifact_path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev file unzip
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test Rust
        run: pnpm test:rust

      - name: Browser E2E (macOS only)
        if: runner.os == 'macOS'
        run: |
          pnpm --filter @md-editor/desktop exec playwright install chromium
          pnpm --filter @md-editor/desktop test:browser

      - name: Validate release version files
        run: |
          node <<'NODE'
          const fs = require("fs");
          const rootPackage = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const desktopPackage = JSON.parse(fs.readFileSync("apps/desktop/package.json", "utf8"));
          const tauriConfig = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8"));
          const cargoToml = fs.readFileSync("apps/desktop/src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargoToml.match(/^\s*version\s*=\s*"([^"]+)"/m)?.[1];
          const versions = [rootPackage.version, desktopPackage.version, tauriConfig.version, cargoVersion];

          if (versions.some((version) => version !== tauriConfig.version)) {
            throw new Error(`Version mismatch: root=${rootPackage.version}, desktop=${desktopPackage.version}, tauri=${tauriConfig.version}, cargo=${cargoVersion}`);
          }
          NODE

      - name: Prepare llama runtime sidecar
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/release/prepare-llama-runtime.mjs

      - name: Build app
        if: github.event_name == 'workflow_dispatch'
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LD_LIBRARY_PATH: "${{ github.workspace }}/apps/desktop/src-tauri/binaries"
        run: ${{ matrix.platform.build_cmd }}

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_path }}
          if-no-files-found: error
