name: Release Desktop App

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:rust

      - name: Build macOS app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm build:macos:release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  build-linux-x64:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev file unzip
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare llama runtime sidecar
        run: node scripts/release/prepare-llama-runtime.mjs --target x86_64-unknown-linux-gnu

      - name: Build workspace packages
        run: pnpm -r --sort build

      - name: Build Linux app
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LD_LIBRARY_PATH: "${{ github.workspace }}/apps/desktop/src-tauri/binaries"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm build:linux:release

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb

  build-linux-arm64:
    name: Build Linux (aarch64)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev file unzip
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare llama runtime sidecar
        run: node scripts/release/prepare-llama-runtime.mjs --target aarch64-unknown-linux-gnu

      - name: Build workspace packages
        run: pnpm -r --sort build

      - name: Build Linux app
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LD_LIBRARY_PATH: "${{ github.workspace }}/apps/desktop/src-tauri/binaries"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm build:linux:release

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux-arm64
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb

  build-windows-x64:
    name: Build Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare llama runtime sidecar
        run: node scripts/release/prepare-llama-runtime.mjs --target x86_64-pc-windows-msvc

      - name: Build workspace packages
        run: pnpm -r --sort build

      - name: Build Windows app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm build:windows:release

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    name: Publish tagged release & update tap
    needs: [build-macos, build-linux-x64, build-windows-x64]
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release version
        id: release_version
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const rootPackage = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const desktopPackage = JSON.parse(fs.readFileSync("apps/desktop/package.json", "utf8"));
          const tauriConfig = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8"));
          const cargoToml = fs.readFileSync("apps/desktop/src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargoToml.match(/^\s*version\s*=\s*"([^"]+)"/m)?.[1];
          const versions = [rootPackage.version, desktopPackage.version, tauriConfig.version, cargoVersion];
          const isPrerelease = tauriConfig.version.includes("-");

          if (versions.some((version) => version !== tauriConfig.version)) {
            throw new Error(`Version mismatch: root=${rootPackage.version}, desktop=${desktopPackage.version}, tauri=${tauriConfig.version}, cargo=${cargoVersion}`);
          }

          console.log(`version=${tauriConfig.version}`);
          console.log(`tag=v${tauriConfig.version}`);
          console.log(`is_prerelease=${isPrerelease}`);
          NODE

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
          IS_PRERELEASE: ${{ steps.release_version.outputs.is_prerelease }}
        run: |
          files=()
          while IFS= read -r file; do
            [[ -n "$file" ]] && files+=("$file")
          done <<< "$(find release-artifacts -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.zip' -o -name '*.app.tar.gz*' \))"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --prerelease
            fi
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            release_flags=()
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --title "Markdown Editor $RELEASE_TAG" \
              --notes "Multi-platform release for $RELEASE_VERSION (macOS, Linux, Windows)." \
              "${release_flags[@]}"
          fi

      - name: Clone Homebrew tap
        if: steps.release_version.outputs.is_prerelease != 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/wmasfoe/homebrew-tap.git" homebrew-tap

      - name: Publish public Homebrew asset
        if: steps.release_version.outputs.is_prerelease != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: md-editor-${{ steps.release_version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          files=()
          while IFS= read -r file; do
            [[ -n "$file" ]] && files+=("$file")
          done <<< "$(find release-artifacts -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.zip' -o -name '*.app.tar.gz*' \))"
          if gh release view "$RELEASE_TAG" --repo wmasfoe/homebrew-tap >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --repo wmasfoe/homebrew-tap --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --repo wmasfoe/homebrew-tap \
              --title "Markdown Editor $RELEASE_TAG" \
              --notes "Public assets for Markdown Editor $RELEASE_VERSION."
          fi

      - name: Sync Cask and Installer Scripts
        if: steps.release_version.outputs.is_prerelease != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
          RELEASE_TAG: md-editor-${{ steps.release_version.outputs.tag }}
        run: |
          dmg_file="$(find release-artifacts -type f -name '*.dmg' -print -quit)"
          linux_x64_file="$(find release-artifacts -type f -name '*amd64.AppImage' -o -name '*x86_64.AppImage' -print -quit)"
          linux_arm64_file="$(find release-artifacts -type f -name '*arm64.AppImage' -o -name '*aarch64.AppImage' -print -quit)"
          win_x64_file="$(find release-artifacts -type f -name '*x64-setup.exe' -o -name '*x64*.exe' -print -quit)"
          win_arm64_file="$(find release-artifacts -type f -name '*arm64-setup.exe' -o -name '*arm64*.exe' -print -quit)"
          updater_file="$(find release-artifacts -type f -name '*.app.tar.gz' -print -quit)"

          dmg_url="$(gh api "repos/wmasfoe/homebrew-tap/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name | endswith(".dmg")) | .browser_download_url' | head -n 1)"
          linux_x64_url="$(gh api "repos/wmasfoe/homebrew-tap/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name | test("x86_64|amd64") and endswith(".AppImage")) | .browser_download_url' | head -n 1)"
          linux_arm64_url="$(gh api "repos/wmasfoe/homebrew-tap/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name | test("aarch64|arm64") and endswith(".AppImage")) | .browser_download_url' | head -n 1)"
          win_x64_url="$(gh api "repos/wmasfoe/homebrew-tap/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name | test("x64") and endswith(".exe")) | .browser_download_url' | head -n 1)"
          win_arm64_url="$(gh api "repos/wmasfoe/homebrew-tap/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name | test("arm64") and endswith(".exe")) | .browser_download_url' | head -n 1)"
          updater_url="$(gh api "repos/wmasfoe/homebrew-tap/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name | endswith(".app.tar.gz")) | .browser_download_url' | head -n 1)"

          export DMG_DOWNLOAD_URL="$dmg_url"
          export DMG_SHA256="$(shasum -a 256 "$dmg_file" | awk '{print $1}')"
          export DMG_FILE_NAME="$(basename "$dmg_file")"
          export CASK_OUTPUT_PATH="homebrew-tap/Casks/md-editor.rb"
          export CASK_RELEASE_REPOSITORY="wmasfoe/homebrew-tap"
          export CASK_RELEASE_TAG="$RELEASE_TAG"
          export CASK_DOWNLOAD_URL="$dmg_url"

          node scripts/release/write-homebrew-cask.mjs

          export LINUX_X64_DOWNLOAD_URL="$linux_x64_url"
          export LINUX_X64_SHA256="$( [ -n "$linux_x64_file" ] && shasum -a 256 "$linux_x64_file" | awk '{print $1}' || echo "" )"
          export LINUX_ARM64_DOWNLOAD_URL="$linux_arm64_url"
          export LINUX_ARM64_SHA256="$( [ -n "$linux_arm64_file" ] && shasum -a 256 "$linux_arm64_file" | awk '{print $1}' || echo "" )"
          export INSTALL_SCRIPT_OUTPUT_PATH="homebrew-tap/install-md-editor.sh"

          node scripts/release/write-install-script.mjs

          export WIN_X64_DOWNLOAD_URL="$win_x64_url"
          export WIN_X64_SHA256="$( [ -n "$win_x64_file" ] && shasum -a 256 "$win_x64_file" | awk '{print $1}' || echo "" )"
          export WIN_ARM64_DOWNLOAD_URL="$win_arm64_url"
          export WIN_ARM64_SHA256="$( [ -n "$win_arm64_file" ] && shasum -a 256 "$win_arm64_file" | awk '{print $1}' || echo "" )"
          export WINDOWS_INSTALL_SCRIPT_OUTPUT_PATH="homebrew-tap/install-md-editor.ps1"

          node scripts/release/write-install-script-windows.mjs

          if [ -n "$updater_file" ] && [ -f "$updater_file.sig" ]; then
            export UPDATER_DOWNLOAD_URL="$updater_url"
            export UPDATER_SIGNATURE="$(cat "$updater_file.sig")"
            export UPDATER_PLATFORM="darwin-aarch64"
            export UPDATER_MANIFEST_OUTPUT_PATH="homebrew-tap/md-editor-latest.json"
            node scripts/release/write-updater-manifest.mjs
          fi

      - name: Publish Homebrew tap updates
        if: steps.release_version.outputs.is_prerelease != 'true'
        working-directory: homebrew-tap
        run: |
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            git checkout -b main
          fi

          git add Casks/md-editor.rb install-md-editor.sh install-md-editor.ps1 md-editor-latest.json

          if git diff --cached --quiet -- Casks/md-editor.rb install-md-editor.sh install-md-editor.ps1 md-editor-latest.json; then
            echo "Homebrew cask, installers, and updater manifest are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update md-editor multi-platform assets to ${{ steps.release_version.outputs.tag }}"
          git push origin main

      - name: Publish website changelog
        if: steps.release_version.outputs.is_prerelease != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm deploy:site
