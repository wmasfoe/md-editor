name: "🐛 Bug 报告 (Bug Report)"
description: "报告 Inkpoint 桌面应用的缺陷或异常行为"
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助我们改进 Inkpoint！在提交之前，请确保搜索现有 Issue，以避免重复提交。

  - type: dropdown
    id: component
    attributes:
      label: 发生问题的模块 (Affected Component)
      description: 请选择问题发生的具体模块
      options:
        - "Desktop (GPUI 窗口、文件与工作区)"
        - "Editor (光标、选区与输入)"
        - "Typesetting (Markdown 排版与渲染)"
        - "Core (文档模型与编辑会话)"
        - "Local AI (本地续写)"
        - "Other / Unsure (其他 / 不确定)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述 (Description)
      description: 清晰扼要地描述发生了什么异常
      placeholder: 缩窄窗口后，换行处的光标与文本出现偏移。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 (Steps to Reproduce)
      description: 提供能够稳定复现该问题的具体步骤
      placeholder: |
        1. 打开桌面应用
        2. 输入以下 Markdown 内容
        3. 按 Enter 换行并移动光标
        4. 观察到编辑器报错/状态异常
    validations:
      required: true

  - type: textarea
    id: markdown-sample
    attributes:
      label: 最小复现 Markdown 文本 (Minimal Markdown Example)
      description: 如果问题与特定 Markdown 文本语法渲染相关，请在此粘贴
      render: markdown
      placeholder: |
        这里是 **中文** 和 English 混排的示例文本。

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 (Expected Behavior)
      description: 描述在正常情况下你期望看到的正确行为
      placeholder: 光标应随文本移动至下一行。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境 (Environment)
      description: 请提供操作系统、应用版本等环境信息
      value: |
        - **操作系统版本与架构**
        - **Inkpoint Beta 版本或 commit hash**
        - **Rust 版本**（从源码运行时）
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 屏幕截图或录屏 (Screenshots / Logs)
      description: 可附上终端日志、截图或录屏

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单 (Checklist)
      options:
        - label: 我已在 Issues 中检索过，确认目前没有相同或相关的 Bug 报告
          required: true
        - label: 我确认提供的信息足够完整，他人能够据此独立复现
          required: true
