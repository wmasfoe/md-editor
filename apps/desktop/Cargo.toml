[package]
name = "inkpoint-gpui"
version = "0.23.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "inkpoint-gpui"
path = "src/main.rs"

[dependencies]
dirs = "6"
futures = "0.3"
gpui-kit.workspace = true
inkpoint-editor-core.workspace = true
inkpoint-editor-gpui.workspace = true
inkpoint-editor-typeset.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ureq = { version = "2.12", default-features = false, features = ["json"] }
url = "2"
