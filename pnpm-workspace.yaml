packages:
  - "apps/*"
  - "apps/mobile/*"
  - "infra/*"
  - "packages/*"

catalog:
  "@playwright/test": ^1.51.1
  "@codemirror/lang-markdown": ^6.5.0
  "@headlessui/react": ^2.2.9
  "@heroicons/react": ^2.2.0
  "next": ^16.2.10
  "@tailwindcss/postcss": ^4.1.17
  "@tailwindcss/vite": ^4.1.17
  "@tauri-apps/api": ^2.2.0
  "@tauri-apps/cli": ^2.2.1
  "@types/node": ^22.10.2
  "@types/react": ^19.0.1
  "@types/react-dom": ^19.0.2
  "@types/sanitize-html": ^2.16.1
  "@vitejs/plugin-react": ^4.3.4
  postcss: ^8.5.6
  react: ^19.0.0
  react-dom: ^19.0.0
  sanitize-html: ^2.17.6
  micromark: ^4.0.0
  micromark-extension-mdx-jsx: ^3.0.0
  micromark-extension-mdx-md: ^2.0.0
  mdast-util-mdx-jsx: ^3.0.0
  mdast-util-from-markdown: ^2.0.0
  tailwindcss: ^4.1.17
  typescript: ^5.7.2
  utools-api-types: ^7.5.1
  vercel: ^49.1.0
  vite: ^6.0.3
  vitest: ^2.1.8
  zustand: ^5.0.0
  i18next: ^24.2.2
  react-i18next: ^15.4.0
  # KaTeX / Mermaid（katex 版本与 overrides 联动，必须全仓一致）
  katex: ^0.18.6
  "@types/katex": ^0.16.8
  mermaid: ^11.17.2
  # CodeMirror 6 家族：多实例会导致状态/视图错乱，必须版本对齐
  "@codemirror/state": ^6.6.0
  "@codemirror/view": ^6.43.1
  "@lezer/common": ^1.5.2
  "@lezer/markdown": ^1.8.0

onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
  sharp: true
confirmModulesPurge: false
verifyDepsBeforeRun: false

# KaTeX 版本收敛：mermaid 11.x 声明 katex ^0.16.47，其余工作区包为 ^0.18.6，
# 两个范围不相交会导致三端各多打一份 261 kB（gzip 77 kB）的 KaTeX。
# mermaid 只使用 katex.renderToString(tex, { throwOnError, displayMode, output })，
# 回归证据：packages/syntax-plugins/tests/katex-mermaid-contract.test.ts 与
# apps/desktop/e2e/codemirror-mermaid-math.spec.ts。
overrides:
  "mermaid>katex": "0.18.6"
